[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-estimator-foundation"
version = "0.1.0"
description = "Evidence-backed estimator foundation and benchmark harness"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2,<3",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27.0"]
eval = ["pandas>=2.2,<4", "pyarrow>=17,<27"]  # reading the optional Itemlet Parquet file

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["parallax*"]

[tool.pytest.ini_options]
pythonpath = ["apps/api"]
testpaths = ["tests"]
